div class="chat-fab" id="chatFab" title="Chat với Petopia AI">
  <span class="chat-fab__icon">🐾</span>
  <span class="chat-fab__badge" id="chatBadge"></span>
</div>

<div class="chat-window" id="chatWindow">
  <div class="chat-header">
    <div class="chat-header__info">
      <div class="chat-header__avatar">🐾</div>
      <div>
        <div class="chat-header__name">Petopia AI</div>
        <div class="chat-header__status"><span class="chat-status-dot"></span> Đang hoạt động</div>
      </div>
    </div>
    <button class="chat-header__close" id="chatClose" title="Đóng">✕</button>
  </div>

  <div class="chat-messages" id="chatMessages">
    <!-- messages injected by JS -->
  </div>

  <div class="chat-quick-btns" id="quickBtns">
    <button class="quick-btn" data-q="Dịch vụ grooming có gì?">🛁 Dịch vụ</button>
    <button class="quick-btn" data-q="Bảng giá dịch vụ?">💰 Bảng giá</button>
    <button class="quick-btn" data-q="Giờ làm việc?">🕐 Giờ mở cửa</button>
    <button class="quick-btn" data-q="Cần chuẩn bị gì trước khi grooming?">📋 Chuẩn bị</button>
  </div>

  <div class="chat-input-row">
    <input type="text" class="chat-input" id="chatInput" placeholder="Nhắn tin cho Petopia AI..." maxlength="300"/>
    <button class="chat-send-btn" id="chatSend">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
